  <!-- Text Label -->
  <text x="21" y="14" fill="#00e5ff" font-family="'Courier New', monospace" font-size="8.5" font-weight="900" letter-spacing="0.5">q04ti</text>
  <text x="21" y="23" fill="#ff007f" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" letter-spacing="1">.WEB</text>
  
